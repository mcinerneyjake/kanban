name: Code Review

# Runs Claude on the PR diff and posts findings as a comment.
#
# FAILS CLOSED (tkt-5f28061cb3bf): with no ANTHROPIC_API_KEY this job goes RED. It used to report
# success, so a green `review` meant either "reviewed, clean" or "never ran" with no way to tell.
# The decision lives in scripts/review-preconditions.mjs so it can be tested by spawning it.
on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

jobs:
  review:
    runs-on: ubuntu-latest
    # Actions secrets are NOT exposed to Dependabot- or fork-triggered `pull_request` runs, so the key
    # is structurally absent there and failing closed would mean ~5 permanent red checks a week with
    # no signal in any of them. Skipping the job reports "skipped", which is visibly distinct from
    # both green and red — an absent check, not a passing one.
    if: github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check preconditions
        id: pre
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # core.quotePath=false: git otherwise emits "src/caf\303\251.ts" with literal quotes for
          # non-ASCII paths, and the trailing quote defeats every extension check downstream.
          git -c core.quotePath=false diff --name-only origin/main...HEAD > changed.txt
          node scripts/review-preconditions.mjs < changed.txt >> "$GITHUB_OUTPUT"

      - name: Get PR diff
        id: diff
        if: steps.pre.outputs.significant == 'true'
        run: |
          git diff origin/main...HEAD > full-diff.txt
          # Truncation is REPORTED, not silent: a partial review that reads as a whole-PR review is
          # the same fail-open shape this workflow was fixed for.
          full=$(wc -c < full-diff.txt)
          head -c 50000 full-diff.txt > diff.txt
          if [ "$full" -gt 50000 ]; then
            echo "truncated=$full" >> "$GITHUB_OUTPUT"
            echo "::warning::Diff is ${full} bytes; only the first 50000 were reviewed."
          fi

      - name: Review with Claude
        if: steps.pre.outputs.significant == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import json, os, subprocess, sys

          diff = open("diff.txt").read().strip()
          if not diff:
              # Reachable only if the filter said "significant" and the diff is empty — a contradiction,
              # so it is a failure rather than a quiet pass.
              print("::error::Preconditions reported reviewable files but the diff is empty.", file=sys.stderr)
              sys.exit(1)

          payload = {
              "model": "claude-sonnet-4-6",
              "max_tokens": 1024,
              "messages": [{
                  "role": "user",
                  "content": (
                      "Review this diff for bugs and significant code quality issues. "
                      "Skip style nits. Format findings as a concise markdown list. "
                      "If there are no significant findings, say so.\n\n"
                      f"```diff\n{diff}\n```"
                  )
              }]
          }

          with open("payload.json", "w") as f:
              json.dump(payload, f)

          result = subprocess.run(
              ["curl", "-sS", "--fail-with-body", "https://api.anthropic.com/v1/messages",
               "-H", f'x-api-key: {os.environ["ANTHROPIC_API_KEY"]}',
               "-H", "anthropic-version: 2023-06-01",
               "-H", "content-type: application/json",
               "-d", "@payload.json"],
              capture_output=True, text=True,
          )
          if result.returncode != 0:
              # Log the provider's own response, not just a generic failure — otherwise a 401 and a
              # 529 are the same red X and neither is actionable.
              print(f"::error::Anthropic API call failed (curl {result.returncode}): "
                    f"{result.stdout.strip()} {result.stderr.strip()}", file=sys.stderr)
              sys.exit(1)

          body = json.loads(result.stdout)
          review = body["content"][0]["text"]
          # Input truncation was already reported; output truncation was not. A response cut off at
          # max_tokens posts as a complete review, which is the same fail-open on the other side of
          # the call.
          if body.get("stop_reason") == "max_tokens":
              review += ("\n\n> **Partial review.** The model hit its output limit, so findings below "
                         "this point are missing.")
          if not review.strip():
              print("::error::The model returned an empty review.", file=sys.stderr)
              sys.exit(1)
          with open("review.txt", "w") as f:
              f.write(review)
          PYEOF

      - name: Delete previous review comments
        if: steps.pre.outputs.significant == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # pipefail: without it the step takes the WHILE loop's status, so a rate-limited or 5xx
          # `gh api` passes green and the stale review comment survives beside the new one.
          set -o pipefail
          gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq '.[] | select(.body | startswith("## Claude Code Review")) | .id' |
          while read -r id; do
            gh api -X DELETE "repos/${{ github.repository }}/issues/comments/$id"
          done

      - name: Post review comment
        if: steps.pre.outputs.significant == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TRUNCATED: ${{ steps.diff.outputs.truncated }}
        run: |
          # Was `[ -f review.txt ] || exit 0` — a missing review file passed the job green. If the
          # review step ran, its output must exist.
          # -s not -f: an EMPTY review.txt passes an existence check, and the posted comment is then
          # a header and footer with nothing between — which reads as "reviewed, clean".
          if [ ! -s review.txt ]; then
            echo "::error::The review step produced no review.txt — refusing to report success."
            exit 1
          fi
          {
            printf '## Claude Code Review\n\n'
            cat review.txt
            if [ -n "$TRUNCATED" ]; then
              printf '\n\n> **Partial review.** The diff is %s bytes; only the first 50000 were sent.\n' "$TRUNCATED"
            fi
            printf '\n\n---\n*Automated review. Address findings in this PR or create follow-up tickets before merging — see CLAUDE.md.*'
          } > comment.txt
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.txt
